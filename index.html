<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const SIZE = 20;

// =======================
// WORLD LAYER
// =======================

const World = {
  entities: {
    wolf_1: { x: 5, y: 5, type: "wolf", energy: 10 },
    deer_1: { x: 15, y: 10, type: "deer", energy: 10 },
    deer_2: { x: 20, y: 12, type: "deer", energy: 10 }
  },

  removeDead() {
    for (const id in this.entities) {
      if (this.entities[id].energy <= 0) {
        delete this.entities[id];
      }
    }
  }
};

// =======================
// ENGINE LAYER
// =======================

const Engine = {

  dist(a, b) {
    return Math.abs(a.x - b.x) + Math.abs(a.y - b.y);
  },

  moveToward(a, b) {
    if (a.x < b.x) a.x++;
    else if (a.x > b.x) a.x--;

    if (a.y < b.y) a.y++;
    else if (a.y > b.y) a.y--;
  },

  moveRandom(a) {
    const r = Math.floor(Math.random() * 4);
    if (r === 0) a.x++;
    if (r === 1) a.x--;
    if (r === 2) a.y++;
    if (r === 3) a.y--;
  },

  update(world) {

  const entities = world.entities;

  const wolves = [];
  const deer = [];

  for (const id in entities) {
    const e = entities[id];
    if (e.type === "wolf") wolves.push(e);
    if (e.type === "deer") deer.push(e);
  }

  // -----------------------
  // WOLVES = HUNTERS
  // -----------------------
  for (const w of wolves) {

    let closest = null;
    let best = 999;

    for (const d of deer) {
      const dist = this.dist(w, d);
      if (dist < best) {
        best = dist;
        closest = d;
      }
    }

    if (closest) {
      this.moveToward(w, closest);

      if (best < 2) {
        closest.energy -= 1;
        w.energy += 2;
      }

    } else {
      this.moveRandom(w);
    }

    w.energy -= 0.05;
  }
    

  // -----------------------
  // DEER = RUNNERS (NEW BEHAVIOR)
  // -----------------------
  for (const d of deer) {

    // flee logic: run away from closest wolf
    let closestWolf = null;
    let best = 999;

    for (const w of wolves) {
      const dist = this.dist(d, w);
      if (dist < best) {
        best = dist;
        closestWolf = w;
      }
    }

    if (closestWolf && best < 6) {
      // flee instead of wander
      if (d.x < closestWolf.x) d.x--;
      else if (d.x > closestWolf.x) d.x++;

      if (d.y < closestWolf.y) d.y--;
      else if (d.y > closestWolf.y) d.y++;
    } else {
      this.moveRandom(d);
    }

    d.energy -= 0.02;
  }

  world.removeDead();
}
};
  
// =======================
// RENDER LAYER
// =======================

const Render = {

  draw(world) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    for (const id in world.entities) {
      const e = world.entities[id];

      ctx.fillStyle = e.type === "wolf" ? "red" : "green";

      ctx.beginPath();
      ctx.arc(e.x * SIZE, e.y * SIZE, 6, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "white";
      ctx.fillText(id, e.x * SIZE + 6, e.y * SIZE);
    }
  }
};

// =======================
// MAIN LOOP
// =======================

function loop() {
  Engine.update(World);
  Render.draw(World);
  requestAnimationFrame(loop);
}

loop();
</script>
